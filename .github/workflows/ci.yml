name: CI

# Push and PR only. No deploy, no migration step, no secrets: this checks that
# the code is sound, it does not change any environment.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per ref. A new push supersedes an in-flight run rather than
  # queueing behind it, so a branch with rapid pushes settles on the latest
  # commit instead of every intermediate one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest

    # pgvector, because the generated migrations open with
    # `CREATE EXTENSION vector` and code_embeddings.embedding is vector(768).
    # Pinned to a major+minor tag so a breaking change upstream cannot silently
    # change what CI proves.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitvision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests read this; unset, the migration tests skip and the rest still
      # run. Points at the throwaway service container above.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gitvision_test

      # Placeholders, not secrets. db/index.ts and github/client.ts evaluate
      # these at module load, so the build fails without them — but nothing
      # connects during a build. A syntactically valid URL is enough; see the
      # build log in the commit that added this file.
      DATABASE_URL: postgres://user:pass@localhost:5432/placeholder
      GITHUB_TOKEN: ci-placeholder-not-a-real-token

    steps:
      - uses: actions/checkout@v4

      # No `bun-version` here on purpose: setup-bun reads the
      # `packageManager` field from package.json, so bumping that one line
      # is what changes what CI installs. Setting `latest` here silently
      # overrode the pin.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # If a migration test fails, the container has already been dumped. This
      # only prints it on failure, so a green run stays quiet.
      - name: Database log on failure
        if: failure()
        run: docker logs ${{ job.services.postgres.id }}
