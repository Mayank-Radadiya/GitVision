name: Backup

# The database holds every customer's source code and embeddings. `syncIssues`
# DELETEs before it re-pulls and `user.deleted` is a hard cascade, so a lost
# database is unrecoverable data. Neon's PITR is not verifiable from here; this
# dump is the half of the plan that is.
on:
  schedule:
    # 03:17 UTC, not 03:00. Every scheduled workflow on GitHub fires on the
    # hour, and the platform drops the queue when the runners are saturated.
    - cron: "17 3 * * *"
  # The cron only fires if the workflow file is on the default branch. Until it
  # is merged, this is the only way to take a dump.
  workflow_dispatch:

concurrency:
  # A manual run that starts while the scheduled one is in flight queues
  # instead of racing it, so two dumps never land in the same window.
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump and verify
    runs-on: ubuntu-latest

    env:
      # A repository secret, not the CI workflow's placeholder. This is the
      # production database — a dump of the placeholder is a green run that
      # backs up nothing.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Outside the checkout, which is what db-backup.ts insists on. The script
      # refuses to write inside the repo, so this also has to be true.
      BACKUP_DIR: ${{ runner.temp }}/backups

    steps:
      - uses: actions/checkout@v4

      # No `bun-version`: setup-bun reads `packageManager` from package.json.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # pg_dump comes from the postgresql-client package already present on the
      # ubuntu-latest image. If a future image drops it, this step fails and the
      # job goes red — which is the intended behaviour, not a silent no-op.
      #
      # The script exits non-zero if pg_dump is missing, if the dump is under
      # 1 KB, or if it lacks CREATE TABLE / projects / project_files / commits.
      # A run step propagates that as a failed step and a red job. Do not wrap
      # this in `|| true`: a backup that skips quietly is worse than one that
      # fails loudly, because nothing pages anyone.
      - name: Take the dump
        run: bun run db:backup

      - name: Upload the dump
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ runner.temp }}/backups/*.sql
          # D-12: 14-day retention. Matches the S3 lifecycle rule once the
          # bucket exists; see docs/operations/backup-retention.md.
          retention-days: 14
          if-no-files-found: error
